<div class="typing-back-content">
	<div class="basic-block basic-block-question-typing">
		<div class="basic-block-inner-wrapper">

			<div class="header-typing">
				<div class="theme-block">
					<div class="theme-span"><span>{{theme}}</span></div>
				</div>
			</div> <!--.header-typing-->

			<div class="body-typing">

				<div class="question-block">
					<span class="question-span">{{question}}</span>
				</div>
				<hr>
				<div class="typing-answer-block">
					<span>{{type:answer}}</span>
				</div>

			</div> <!--.body-typing-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-question-typing-->
</div> <!--.typing-back-content-->
