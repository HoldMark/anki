<script src="sentence-examples.js"></script>
<script src="hints.js"></script>
<script src="word-tree.js"></script>

<div class="typing-back-content">

	<div class="basic-block basic-block-typing">
		<div class="basic-block-inner-wrapper">

			<div class="header-typing">
				<div class="theme-block"><span>word</span></div>
			</div>
			<div class="body-typing">
				{{type:word}}
			</div>

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-typing-->
	<br>
	<div class="basic-block basic-block-definition">
		<div class="basic-block-inner-wrapper">

			<div class="header-definition">
				<div class="sense-block">
					<span class="sense-span">{{sense}}</span>
					<span class="pos-span">{{part_of_speech}}</span>
					<span class="trans-span">{{trans}} {{trans_type}}</span>
					<span class="hints-span">Hints: <span class="hide-hints-span">{{hints}}</span></span>
				</div> <!--.sense-block-->
			</div> <!--.header-definition-->

			<div class="body-definition">

				<div class="definition-text-block">
					<span class="definition-span">{{definition}}</span>
				</div> <!--.definition-text-block-->

				<hr class="hr-before-example-block">

				<div class="example-block">
					<ul>
						<li>{{example_1}}</li>
						<li>{{example_2}}</li>
						<li>{{example_3}}</li>
						<li>{{example_4}}</li>
						<li>{{example_5}}</li>
						<li>{{example_6}}</li>
						<li>{{example_7}}</li>						
					</ul>
				</div>
				<hr>
				<div class="button-block">
					<div class="button-audio-block">
						<span class="audio-span">{{audio}}</span>
					</div>
					<div class="button-video-block">
						<a href="https://youglish.com/pronounce/{{word}}/english/uk">
							<span class="youglish-link">YouGlish</span>
						</a>
					</div>
				</div><!--.button-block-->
			</div> <!--.body-definition-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-definition-->

	<div class="basic-block basic-block-word-tree" data-trans="{{trans}}" data-pos="{{part_of_speech}}" data-sense="{{sense}}" data-definition="{{definition}}">
		<div class="basic-block-inner-wrapper">

			<div class="header-word-tree">
				<span class="word-tree-title">Other meanings</span>
			</div> <!--.header-word-tree-->

			<div class="word-tree-collapsible">

				<div class="body-word-tree"></div> <!--.body-word-tree-->

				<div class="word-tree-more-block">
					<a href="https://dictionary.cambridge.org/dictionary/english/{{word}}" class="word-tree-more-link">see more...</a>
				</div> <!--.word-tree-more-block-->

			</div> <!--.word-tree-collapsible-->

			<span class="word-tree-data">{{word_tree}}</span>

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-word-tree-->

</div> <!--.typing-back-content-->
