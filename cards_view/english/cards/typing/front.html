<script src="hints.js"></script>
<script src="typing-answer.js"></script>
<script src="remove-empty-image-block.js"></script>
<script src="collapsible-blocks.js"></script>

<div class="typing-front-content" data-note-uuid="{{_system_note_uuid}}">
	<div class="basic-block basic-block-typing">
		<div class="basic-block-inner-wrapper">

			<div class="header-typing">
				<div class="theme-block"><span>word</span></div>
			</div>
			<div class="body-typing">
				{{type:word}}
			</div>

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-typing-->
	<br>
	<div class="basic-block basic-block-definition">
		<div class="basic-block-inner-wrapper">

			<div class="header-definition">
				<div class="sense-block">
					<span class="sense-span">{{sense}}</span>
					<span class="pos-span">{{part_of_speech}}</span>
					<span class="hints-span">Hints: <span class="hide-hints-span">{{hints}}</span></span>
				</div>
			</div> <!--.header-definition-->

			<div class="body-definition">
				<div class="definition-text-block">
					<span class="definition-span">{{definition}}</span>
				</div> <!--.definition-text-block-->
			</div> <!--.body-definition-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-definition-->

	<div class="basic-block basic-block-image">
		<div class="basic-block-inner-wrapper">

			<div class="collapsible-header">
				<span class="collapsible-title">Images</span>
			</div> <!--.collapsible-header-->

			<div class="collapsible-body">
				<div class="img-block">
					{{picture}}
				</div>
			</div> <!--.collapsible-body-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-image-->
</div>
