<div class="task-front-content">
	<div class="basic-block basic-block-task">
		<div class="basic-block-inner-wrapper">

			<div class="header-task">
				<div class="theme-block">
					<div class="theme-span"><span>{{theme}}</span></div>
				</div>
			</div> <!--.header-task-->

			<div class="body-task">
				<div class="question-block">
					<span class="question-span" data-answer="{{answer}}">{{question}}</span>
				</div>

				<hr>

				<div class="task-typing-answer-block">
					<span>{{type:answer}}</span>
				</div>
			</div> <!--.body-task-->

			<div class="footer-task">
				<span class="new-card-label">new</span>
			</div> <!--.footer-task-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-task-->
</div> <!--.task-front-content-->
