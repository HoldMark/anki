<script src="sentence-examples.js"></script>
<script src="remove-empty-image-block.js"></script>
<script src="set-image-title.js"></script>
<script src="georgian-hints.js"></script>
<script src="georgian-collapsible-blocks.js"></script>

<div class="definition-back-content">

	<div class="basic-block basic-block-definition">
		<div class="basic-block-inner-wrapper">

			<div class="header-definition">
				<div class="sense-block">
					<span class="pos-span"></span>
				</div>
			</div> <!--.header-definition-->

			<div class="body-definition">
				<div class="definition-text-block">
					<span class="definition-span">{{definition}}</span>
				</div> <!--.definition-text-block-->
			</div> <!--.body-definition-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-definition-->

	<br>

	<div class="basic-block basic-block-word">
		<div class="basic-block-inner-wrapper">

			<div class="header-word">
				<!--<div class='theme-block'><span></span></div>-->
			</div>

			<div class="body-word">

				<div class="word-block">
					<a href="https://translate.google.com/?sl=ka&tl=en&text={{word}}&op=translate"><span class="word-span">{{word}}</span></a>
					<span class="trans-hint-span trans-span"> {{trans}}</span>
				</div>
				<hr>
				<div class="button-block">

					<div class="button-audio-block">
						<span class="audio-span">{{audio}}</span>
					</div>

					<div class="button-video-block">
						<a href="#">
						</a>
					</div>

				</div><!--.button-block-->

				<hr class="hr-before-example-block hr-after-button-block">

				<div class="example-block">
					<ul>
						<li>{{example_1}}</li>
						<li>{{example_2}}</li>
						<li>{{example_3}}</li>
						<li>{{example_4}}</li>
						<li>{{example_5}}</li>
						<li>{{example_6}}</li>
						<li>{{example_7}}</li>
					</ul>
				</div> <!--.example-block-->

			</div> <!--.body-word-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-word-block-->

	<div class="basic-block basic-block-image">
		<div class="basic-block-inner-wrapper">

			<div class="collapsible-header">
				<span class="collapsible-title">Images</span>
			</div> <!--.collapsible-header-->

			<div class="collapsible-body">
				<div class="img-block" data-word="{{word}}">
					{{picture}}
					<div class="img-caption"></div>
				</div>
			</div> <!--.collapsible-body-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-image-->

	<!-- needs that to display main example -->

	<span class="hidden-example">{{example_1}}</span>
	<span class="hidden-example">{{example_2}}</span>
	<span class="hidden-example">{{example_3}}</span>
	<span class="hidden-example">{{example_4}}</span>
	<span class="hidden-example">{{example_5}}</span>
	<span class="hidden-example">{{example_6}}</span>
	<span class="hidden-example">{{example_7}}</span>

	<!-- needs that to display main example -->

</div> <!--.definition-back-content-->
