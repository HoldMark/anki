<script src="card-lists.js"></script>

<div class="lists-back-content">
	<div class="basic-block basic-block-question">
		<div class="basic-block-inner-wrapper">

			<div class="header-question">
				<div class="theme-block">
					<div class="theme-span"><span>{{theme}}</span></div>
				</div>
			</div> <!--.header-question-->

			<div class="body-question">
				<div class="question-block">
					<span class="question-span">{{question}}</span>
				</div>
			</div> <!--.body-question-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-question-->

	<div class="basic-block basic-block-answer">
		<div class="basic-block-inner-wrapper">
			<div class="list-block list-block-open">
				{{answer}}
			</div> <!--.list-block-->
		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-answer-->

</div> <!--.lists-back-content-->
