<script src="verses.js"></script>

<div class="verses-front-content">
	<div class="basic-block basic-block-verses">
		<div class="basic-block-inner-wrapper">

			<div class="header-verses">
				<div class="theme-block">
					<div class="theme-span"><span>{{theme}}</span></div>
				</div>
			</div> <!--.header-verses-->

			<div class="body-verses">
				<div class="question-block">
					<span class="question-span">{{question}}</span>
				</div>
			</div> <!--.body-verses-->

		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-verses-->

	<div class="basic-block basic-block-verse-text">
		<div class="basic-block-inner-wrapper">
			<div class="verse-block verse-block-hidden">
				{{answer}}
			</div> <!--.verse-block-->
		</div> <!--.basic-block-inner-wrapper-->
	</div> <!--.basic-block .basic-block-verse-text-->

</div> <!--.verses-front-content-->
